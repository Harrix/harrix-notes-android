<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/JetBrainsMono-Italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/JetBrainsMono-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/JetBrainsMono-MediumItalic.woff2") format("woff2");
        font-weight: 500;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/JetBrainsMono-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Fira Sans";
        src: url("../fonts/FiraSans-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Fira Sans";
        src: url("../fonts/FiraSans-Italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Fira Sans";
        src: url("../fonts/FiraSans-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Fira Sans";
        src: url("../fonts/FiraSans-MediumItalic.woff2") format("woff2");
        font-weight: 500;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Fira Sans";
        src: url("../fonts/FiraSans-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .cm-editor {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <script>
      window.onerror = function (message, source, line, column, error) {
        try {
          if (window.NotesEditorHost) {
            window.NotesEditorHost.onError(
              String(message) + " @" + String(source) + ":" + String(line),
            );
          }
        } catch (e) {}
        return false;
      };
    </script>
    <script src="editor.js"></script>
  </body>
</html>
